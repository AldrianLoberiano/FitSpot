<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../images/fitstop_white_logo.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <title>Login / Register - FitSpot</title>
</head>
<body>
<header>
        <div class="brand">
            <a href="../index.html">
                <img src="../images/fitstop_white_logo.png" alt="FitSpot">
            </a>
            <h1 class="visually-hidden">FitSpot - Gym Membership &amp; Class Booking</h1>
        </div>

        <div class="header-spacer" aria-hidden="true"></div>

        <div class="header-actions">
            <a href="../index.html" class="login-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Back to Home
            </a>
        </div>
    </header>

<main>
<section class="auth-page">
    <div class="auth-card" id="login">
        <h2>Login</h2>

        <form>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" autocomplete="email">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" autocomplete="current-password">

            <button type="submit">Login</button>
        </form>

        <p class="card-note">Don't have an account? <a href="#register">Register</a></p>
    </div>

    <div class="auth-card" id="register">
        <h2>Register</h2>

        <form>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" autocomplete="name">

            <label for="reg-email">Email:</label>
            <input type="email" id="reg-email" name="reg-email" autocomplete="email">

            <label for="reg-password">Password:</label>
            <input type="password" id="reg-password" name="reg-password" autocomplete="new-password">

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password">

            <button type="submit">Register</button>
        </form>

        <p class="card-note">Already have an account? <a href="#login">Login</a></p>
    </div>
</section>
</main>
<footer>
    <p>&copy; 2026 FitSpot. All rights reserved.</p>
    <p>Gym Membership & Class Booking</p>
</footer>

</body>
</html>
